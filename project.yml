name: ScreenBoss
options:
  bundleIdPrefix: com.jayclark
  deploymentTarget:
    macOS: "13.0"
targets:
  ScreenBoss:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayclark.screenboss
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BridgingHeader.h
        MACOSX_DEPLOYMENT_TARGET: 13.0
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "-framework CoreBrightness"
        FRAMEWORK_SEARCH_PATHS: "/System/Library/PrivateFrameworks"
