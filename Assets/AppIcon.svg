<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="backScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
    <linearGradient id="frontScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#b4b4b4"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- icon base -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- back monitor -->
  <g filter="url(#shadow)">
    <rect x="150" y="170" width="560" height="390" rx="36" fill="#1c1c1c" stroke="#505050" stroke-width="6"/>
    <rect x="182" y="202" width="496" height="326" rx="14" fill="url(#backScreen)"/>
  </g>
  <rect x="396" y="560" width="68" height="70" fill="url(#stand)"/>
  <rect x="320" y="626" width="220" height="22" rx="11" fill="#2a2a2a"/>

  <!-- front monitor -->
  <g filter="url(#shadow)">
    <rect x="304" y="372" width="570" height="400" rx="38" fill="#050505" stroke="#6a6a6a" stroke-width="6"/>
    <rect x="338" y="406" width="502" height="332" rx="14" fill="url(#frontScreen)"/>
    <!-- subtle screen glare -->
    <path d="M338 420 a14 14 0 0 1 14 -14 H640 L520 738 H352 a14 14 0 0 1 -14 -14 Z" fill="#ffffff" opacity="0.14"/>
  </g>
  <rect x="553" y="772" width="72" height="72" fill="url(#stand)"/>
  <rect x="462" y="838" width="254" height="26" rx="13" fill="#0a0a0a" stroke="#5a5a5a" stroke-width="3"/>
</svg>
