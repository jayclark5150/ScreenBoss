<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E2A78"/>
    </linearGradient>
    <linearGradient id="screenFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="screenBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1240" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Base tile (macOS icon grid: 824pt body on 1024 canvas) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="412" fill="url(#gloss)"/>
  </g>

  <!-- Back display -->
  <g filter="url(#shadow)">
    <rect x="410" y="250" width="390" height="270" rx="34" fill="#E5E9F5"/>
    <rect x="432" y="272" width="346" height="226" rx="16" fill="url(#screenBack)"/>
  </g>

  <!-- Front display -->
  <g filter="url(#shadow)">
    <path d="M410 640 L382 720 L478 720 L450 640 Z" fill="#D5DBEA"/>
    <rect x="330" y="712" width="200" height="30" rx="15" fill="#E5E9F5"/>
    <rect x="224" y="370" width="412" height="286" rx="36" fill="#FFFFFF"/>
    <rect x="248" y="394" width="364" height="238" rx="18" fill="url(#screenFront)"/>
    <!-- brightness glyph on front screen -->
    <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.95">
      <circle cx="430" cy="513" r="38" fill="#FFFFFF" stroke="none"/>
      <line x1="430" y1="441" x2="430" y2="455"/>
      <line x1="430" y1="571" x2="430" y2="585"/>
      <line x1="358" y1="513" x2="372" y2="513"/>
      <line x1="488" y1="513" x2="502" y2="513"/>
      <line x1="379" y1="462" x2="389" y2="472"/>
      <line x1="471" y1="554" x2="481" y2="564"/>
      <line x1="379" y1="564" x2="389" y2="554"/>
      <line x1="471" y1="472" x2="481" y2="462"/>
    </g>
  </g>
</svg>
